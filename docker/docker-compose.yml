services:
  dsh:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DSH_VERSION: 0.2.0-rc.2
        PURGE_VERSION: 1.1.71
    image: dsh-purge:1.1.71
    container_name: dsh
    init: true
    restart: unless-stopped
    ports:
      # 左侧 3080 是本机/宿主上的入口（浏览器访问 localhost:3080）
      # 右侧 3081 是容器内 socat 中继口，再转给 dsh 的 127.0.0.1:3080
      - "127.0.0.1:3080:3081"
    volumes:
      # dsh 配置、会话、purge 的备份都落在这里，重建容器不丢
      - ./data:/root/.dsh
      # agent 的工作目录挂到宿主，生成的文件在 docker\data\test 下可直接看到
      - ./data/test:/root/test
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RELAY_PORT: "3081"
      DSH_PORT: "3080"
    # dsh 必须显式指定要启动的 profile；web 即官方 web UI profile
    # --no-open：容器内没有浏览器，避免无意义地尝试拉起默认浏览器
    command: ["dsh", "web", "--no-open"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
